name: Validate

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before Install: needs nothing but the node stdlib, so a drifted or
      # corrupted logo fails in seconds instead of after a full build.
      - name: Brand assets
        run: node scripts/check-brand-assets.mjs

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.lint?0:1)"; then
            npm run lint
          else
            echo "skipped: no lint script"
          fi

      - name: Typecheck
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.typecheck?0:1)"; then
            npm run typecheck
          else
            echo "skipped: no typecheck script"
          fi

      - name: Test
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.test?0:1)"; then
            npm test
          else
            echo "skipped: no test script"
          fi

      - name: Build (mandatory)
        run: |
          node -e "const s=require('./package.json').scripts||{};if(!s.build){console.error('missing build script');process.exit(1)}"
          npm run build

      # The favicon and touch icon are wired up by file convention alone -- no
      # import, nothing in layout.tsx. This asks the build output whether that
      # actually happened, rather than assuming it did.
      - name: Icon routes
        run: node scripts/check-icon-routes.mjs

      # And this asks a running server, which is the only thing that proves a
      # browser would receive the icons. Build output existing is not the same
      # as the HTML carrying <link rel="icon">.
      - name: Icon smoke test
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up after ${i}s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server exited before becoming ready"
              exit 1
            fi
            sleep 1
          done

          curl -sf -o /dev/null http://localhost:3000/ || {
            echo "server never became ready"
            exit 1
          }

          BASE_URL=http://localhost:3000 node scripts/smoke-icons.mjs
