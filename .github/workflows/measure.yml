Name: measure

# Runs the offline reference renderer and commits its numbers back to the
# branch, so a claim about the engine's tempo or transients is a claim with a
# workflow run behind it rather than a claim made by reading code.
#
# Deliberately NOT on main. This job needs `contents: write` to commit the
# report, and a workflow with write permission should touch as few branches as
# possible. It is also not a gate: `validate.yml` decides whether a branch is
# mergeable. This one produces evidence.
#
# Path filter: a branch that only touches CSS cannot change a render, and a
# four-mode 120 s render costs several minutes. Use workflow_dispatch to force
# a run.

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
    paths:
      - 'generator/**'
      - 'src/audio/**'
      - '.github/workflows/measure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          # Needed so the commit-back below can push to the same ref.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: python -m pip install --disable-pip-version-check --quiet numpy

      # Order matters. If the measurement code is broken, its numbers are
      # worthless, so the self-test runs first and a failure stops the job
      # before any figure is written anywhere.
      - name: Self-test the measurement code
        run: python generator/engine_ref.py --selftest

      # Then: does the reference renderer still agree with the presets the app
      # actually ships? A silent divergence here would make every number below
      # a measurement of the wrong engine.
      - name: Check engine_ref.py against presets.ts
        run: python generator/engine_ref.py --check

      - name: Measure every mode
        run: |
          set -euo pipefail
          mkdir -p generator
          {
            echo "# Engine measurements"
            echo
            echo "Generated by \`.github/workflows/measure.yml\`. Do not hand-edit:"
            echo "regenerate it instead, or the next run will overwrite the edit."
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- render: 120 s per mode, 44100 Hz, seed 12345, first 2 s excluded"
            echo "  from analysis (that is the master fade-in, not the music)"
            echo
            echo "These are measurements of the Python reference renderer, which"
            echo "is exact for tempo and envelope shape and approximate for the"
            echo "biquad and the compressor. See the module docstring in"
            echo "\`generator/engine_ref.py\` for what is faithful and what is not."
            echo
          } > generator/measurements.md
          python generator/engine_ref.py \
            --measure --all --seconds 120 --compare --markdown \
            >> generator/measurements.md
          echo
          cat generator/measurements.md

      - name: Commit the report back
        run: |
          set -euo pipefail
          if git diff --quiet -- generator/measurements.md; then
            echo "Measurements unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/measurements.md
          # Commits made with GITHUB_TOKEN do not trigger workflows, which is
          # what stops this job from re-running itself forever.
          git commit -m "ci: engine measurements for ${GITHUB_SHA:0:7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
